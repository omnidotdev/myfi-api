name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Knip
        run: bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run via the package script so the --isolate flag lives in one place.
      # --isolate gives each test file a fresh module registry, which stops
      # process-global mock.module overrides leaking across files (the source
      # of the order-dependent CI-only test failures)
      - name: Test
        run: bun run test
